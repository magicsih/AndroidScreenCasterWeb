worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control no-store always;
        client_max_body_size 64k;

        # Only expose the read endpoint. Publishing, RTSP and the control API stay private.
        location ~ ^/screen/whep(?:/[a-zA-Z0-9-]+)?$ {
            proxy_pass http://media:8889;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 15s;
            proxy_buffering off;
        }
        location / { try_files $uri $uri/ =404; }
    }
}
