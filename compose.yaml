services:
  media:
    image: bluenviron/mediamtx:1.21.1-ffmpeg@sha256:00ef3d1a243f3769ca36769b47df241a0c269c83a7735005b817505c49adb651
    restart: unless-stopped
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${CAST_HOST:-127.0.0.1}
    ports:
      - "${TCP_BIND:-0.0.0.0:49152}:49152/tcp"
      - "${RTC_BIND:-0.0.0.0:8189}:8189/udp"
      - "${RTC_BIND:-0.0.0.0:8189}:8189/tcp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      options:
        max-size: 10m
        max-file: "2"

  web:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    entrypoint: [nginx, -g, "daemon off;"]
    user: "101:101"
    depends_on:
      - media
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:8080/tcp"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /var/run:uid=101,gid=101,mode=0700
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      options:
        max-size: 10m
        max-file: "2"
